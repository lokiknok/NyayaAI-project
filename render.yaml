# Render Blueprint Configuration for NyayaAI
# Docs: https://render.com/docs/blueprint-spec
version: "1"

services:
  # -------------------------------------------------------------
  # 1. NyayaAI Python FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: nyaya-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_MOCK_AI
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: ""
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./nyaya_ai.db
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # -------------------------------------------------------------
  # 2. NyayaAI React Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: nyaya-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      # React Router SPA catch-all rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nyaya-backend
          property: host

